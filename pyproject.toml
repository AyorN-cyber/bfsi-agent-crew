[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bfsi-agent-crew"
version = "0.1.0"
description = "A multi-agent loan application review demo built on CrewAI, with policy retrieval and an offline mode."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ayomide Olabisi" }]
keywords = ["crewai", "multi-agent", "rag", "llm", "banking", "bfsi"]

[project.optional-dependencies]
live = ["crewai>=0.100"]
dev = ["pytest>=8"]

[project.scripts]
bfsi-crew = "bfsi_crew.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
